services:
  db:
    image: postgres:16-alpine
    container_name: cupra-nms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nms
      POSTGRES_PASSWORD: nms
      POSTGRES_DB: nms
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nms -d nms"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
